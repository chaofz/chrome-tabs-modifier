<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bulk tabs</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --border: #d8dde4;
      --text: #1a1d24;
      --accent: #4a6fa8;
      --accent-hover: #3d5d8f;
      --radius-panel: 8px;
      --radius-field: 6px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      border-radius: var(--radius-panel);
      overflow: hidden;
    }

    body {
      width: 380px;
      padding: 15px;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
    }

    label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 8px 10px 10px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-field);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.45;
      resize: vertical;
      background: #fff;
      white-space: pre;
      overflow-x: auto;
      overflow-y: auto;
    }

    textarea:focus {
      outline: 2px solid rgba(74, 111, 168, 0.4);
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .actions button {
      flex: 1;
      margin-top: 0;
      padding: 10px 14px;
      border: none;
      border-radius: var(--radius-panel);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .actions button.primary {
      background: var(--accent);
      color: #fff;
    }

    .actions button.primary:hover {
      background: var(--accent-hover);
    }

    .actions button.secondary {
      background: #fff;
      color: var(--accent-hover);
      border: 1px solid var(--border);
    }

    .actions button.secondary:hover {
      background: #eef1f5;
    }

    .actions button:active {
      transform: scale(0.99);
    }
  </style>
</head>

<body>
  <textarea id="urls" spellcheck="false" wrap="off"></textarea>
  <div class="actions">
    <button type="button" id="copy" class="secondary">Copy links</button>
    <button type="button" id="open" class="primary">Open tabs</button>
  </div>
  <script src="popup.js"></script>
</body>

</html>
